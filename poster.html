  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on.
       QR codes are static inline SVG, generated locally (see README). */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #E9DCD5; font-family: Jost, Arial, sans-serif; color: #2B1F27; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 500 15px Jost, sans-serif; padding: 0 24px; min-height: 44px; border: 0; border-radius: 999px; background: #5E2750; color: #FBF7F2; cursor: pointer; }
    .toolbar a { font: 500 15px Jost, sans-serif; color: #5E2750; align-self: center; min-height: 44px; display: inline-flex; align-items: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #FBF7F2;
      padding: 13mm 13mm 11mm; display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative; box-shadow: 0 20px 60px rgba(58,23,51,.25); overflow: hidden;
    }
    .sheet::before { content: ""; position: absolute; inset: 5mm; border: 0.3mm solid #5E2750; pointer-events: none; }
    .sheet::after { content: ""; position: absolute; inset: 7mm; border: 0.25mm dashed #B89AA9; pointer-events: none; }
    .logo { width: 19mm; height: 19mm; }
    .name { margin: 3.5mm 0 0; font: 500 13.5mm/0.95 'Cormorant Garamond', Garamond, serif; letter-spacing: -.005em; }
    .sub { margin: 2.2mm 0 0; font: 500 2.7mm Jost, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #5E2750; }
    .ar-name { margin: 1.6mm 0 0; font: 600 4mm/1.4 'IBM Plex Sans Arabic', sans-serif; color: #5E2750; }
    .rule { width: 18mm; height: 0; border-top: 0.35mm dashed #5E2750; margin: 4.5mm 0 4mm; }
    .cta { margin: 0; font: italic 500 8.4mm/1.05 'Cormorant Garamond', serif; color: #5E2750; }
    .cta-ar { margin: 1.6mm 0 0; font: 500 4mm/1.45 'IBM Plex Sans Arabic', sans-serif; color: #4a3d45; }
    .qr-box { margin-top: 4.5mm; padding: 2.5mm; background: #fff; border: 0.3mm solid #E2D3CC; border-radius: 1.5mm; }
    .qr { display: block; width: 54mm; height: 54mm; }
    .phone { margin: 4.5mm 0 0; font: 500 8.6mm/1 Jost, sans-serif; letter-spacing: .02em; }
    .phone-label { margin: 1.6mm 0 0; font: 500 2.6mm Jost, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #5E2750; }
    .foot {
      margin-top: auto; width: 100%; display: flex; align-items: center; gap: 4mm; text-align: start;
      padding-top: 3.5mm; border-top: 0.25mm solid #E2D3CC;
    }
    .qr-small { display: block; width: 19mm; height: 19mm; flex: none; background: #fff; padding: 1.2mm; box-sizing: content-box; border: 0.25mm solid #E2D3CC; }
    .foot p { margin: 0; font: 400 2.85mm/1.45 Jost, sans-serif; color: #4a3d45; }
    .foot b { font-weight: 500; color: #2B1F27; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 600px) {
      .sheet { zoom: .62; }
    }
  </style>
